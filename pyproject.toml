[project]
name = "revenue-recovery-agent"
version = "0.1.0"
description = "AI Revenue Recovery Agent for Razorpay merchants"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",
    "google-genai>=0.1.0",
    "groq>=0.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
